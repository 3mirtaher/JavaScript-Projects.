<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter">
        <div class="txt">
            <h2>Counter</h2>
            <p>Count Up , Down or start Over</p>
        </div>
        <div class="show-count">
            <div class ="count">0</div>
            <p id="message"></p>
        </div>
        <div class="step">
            <p>step</p>
            <form action="">
                <input type="text">
            </form>
        </div>
        <div class="buttons">
            <button id="decrease" class="decrease" aria-label="Decrease">-</button>
            <button id="reset" class="reset">Reset</button>
            <button id="increase" class="increase" aria-label="Increase">+</button>
        </div>
        <div class="postision">
            <div></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
