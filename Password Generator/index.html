<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2 class="headertxt">Password Generator</h2>
        <form class="formone" action="">
            <input class="input" type="text">
            <button class="copybtn">Copy</button>
        </form>

        <div class="strength">
        <div class="strength-head">
            <p>Strength</p>
            <p class="level1"></p>
        </div>
        <div class="bars">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <div class="length">
        <div class="length-head">
            <p>Length</p>
            <p class="level2">0</p>
        </div>
        <form class="lengthform" action="">
                <input class="range" value="0" type="range">
            </form> 
        </div>

        <div class="inbox">
            <div class="item">
              <input type="checkbox"> 
              <p id="uppercase">Uppercase (A-Z)</p>
            </div>
            <div class="item">
              <input type="checkbox">
              <p id="lowercase">Lowercase (a-z)</p>
            </div>
            <div class="item">
              <input type="checkbox">
              <p id="numbers">Numbers (0-9)</p>
            </div>
            <div class="item">
              <input type="checkbox">
              <p id="symbols">Symbols (!@#$)</p>
            </div>
        </div>

        <h2 class="genratebtn">Generate Password</h2>
    </div>
    <script src="main.js"></script>
</body>
</html>
